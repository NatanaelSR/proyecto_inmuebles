      <stop offset="0%" stop-color="#16324F"/>
      <stop offset="100%" stop-color="#0E2135"/>
    </linearGradient>
    <linearGradient id="favGoldBirdhouse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5C8"/>
      <stop offset="50%" stop-color="#D6B77A"/>
      <stop offset="100%" stop-color="#B8934E"/>
