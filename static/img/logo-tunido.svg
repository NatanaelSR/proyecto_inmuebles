<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="goldBirdhouseCleanLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6B77A"/>
      <stop offset="100%" stop-color="#B8934E"/>
    </linearGradient>
  </defs>

  <!-- Isotipo: Pajarera minimalista pura para documentos y superficies claras -->
  <g transform="translate(10, 10)">
    <!-- Argolla superior -->
    <path d="M29 9 C29 6.8 30.3 5.5 32 5.5 C33.7 5.5 35 6.8 35 9" fill="none" stroke="url(#goldBirdhouseCleanLight)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Techo a dos aguas en Azul Marino -->
    <path d="M10 24 L32 9 L54 24" fill="none" stroke="#16324F" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Muros de la pajarera -->
    <path d="M16 25.5 V50 C16 52 17.5 53.5 19.5 53.5 H44.5 C46.5 53.5 48 52 48 50 V25.5" 
          fill="none" stroke="#16324F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Entrada circular dorada -->
    <circle cx="32" cy="37" r="8" fill="url(#goldBirdhouseCleanLight)"/>
    <circle cx="32" cy="37" r="5.2" fill="#FFFFFF"/>
  </g>

  <!-- Tipografía TuNido sobre fondo claro -->
  <text x="80" y="47" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.8px" fill="#16324F">
    Tu<tspan fill="#C4A362">Nido</tspan>
  </text>
  <text x="81" y="64" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4px" fill="#64748B" text-transform="uppercase">
    Encuentra tu lugar
  </text>
</svg>
