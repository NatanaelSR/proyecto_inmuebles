{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 700px;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"><i class="fas fa-envelope me-2"></i>Contactar al arrendador</h4>
        </div>
        <div class="card-body p-4">
            <h5>{{ inmueble.nombre }}</h5>
            <p class="text-muted mb-2"><i class="fas fa-map-marker-alt me-2"></i>{{ inmueble.direccion }}</p>
            <p><strong>Propietario:</strong> {{ propietario.get_full_name|default:propietario.username }}</p>
            <hr>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="mensaje" class="form-label">Tu mensaje</label>
                    <textarea id="mensaje" name="mensaje" class="form-control" rows="6"
                        placeholder="Hola, estoy interesado en este inmueble..." required></textarea>
                    <div class="form-text">Tu mensaje será enviado al correo del propietario.</div>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{% url 'detalle_inmueble' inmueble.pk %}" class="btn btn-outline-secondary">Volver</a>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane me-2"></i>Enviar
                        mensaje</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
