{% extends 'base.html' %}

{% block title %}Inicio - Arriendo Inmuebles{% endblock %}

{% block content %}
<div class="p-5 mb-4 bg-light rounded-3 border">
    <div class="container-fluid py-3">
        <h1 class="display-5 fw-bold">Bienvenido al Portal de Inmuebles</h1>
        <p class="col-md-8 fs-4">Encuentra y gestiona propiedades en arriendo de manera rápida y segura.</p>
        {% if not user.is_authenticated %}
        <a class="btn btn-primary btn-lg" href="{% url 'register' %}" role="button">Crear una cuenta</a>
        {% endif %}
    </div>
</div>
{% endblock %}
