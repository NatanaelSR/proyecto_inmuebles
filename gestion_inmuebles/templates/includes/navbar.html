<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">

        <a class="navbar-brand" href="{% url 'home' %}">Arriendo Inmuebles</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                <li class="nav-item">
                    <span class="nav-link text-light me-2">Hola, <strong>{{ user.username }}</strong></span>
                </li>
                <li class="nav-item">
                    <form action="{% url 'logout' %}" method="post" class="d-inline">

                        <button type="submit" class="btn btn-outline-light btn-sm mt-1">Cerrar Sesión</button>
                    </form>
                </li>
                {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'login' %}">Iniciar Sesión</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-primary btn-sm ms-2 mt-1" href="{% url 'register' %}">Registrarse</a>
